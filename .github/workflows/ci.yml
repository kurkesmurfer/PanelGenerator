name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
      - name: Selftest
        run: .build/debug/PanelGenerator --selftest out
      - uses: actions/upload-artifact@v4
        with:
          name: pg_demo
          path: out/pg_demo.png
